name: crash-test
# Runs the app on an Android emulator, signs in with a fresh test account and records the log.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/crash-test.yml"]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup.sh
      - run: flutter pub get
      - name: Test account
        id: acct
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          email="ci$(date +%s)@adda-test.dev"; pass="Ci-$(openssl rand -hex 8)"
          curl -s -X POST "$URL/auth/v1/signup" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$pass\"}" | head -c 200; echo
          echo "::add-mask::$pass"
          echo "email=$email" >> "$GITHUB_OUTPUT"; echo "pass=$pass" >> "$GITHUB_OUTPUT"
      - name: Build x86_64 APK (same code, auto login)
        env: { ADDA_ABI: x86_64 }
        run: |
          flutter build apk --profile --target-platform android-x64 \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=AUTO_LOGIN_EMAIL=${{ steps.acct.outputs.email }} --dart-define=AUTO_LOGIN_PASSWORD=${{ steps.acct.outputs.pass }} \
            --android-project-arg=addaAbi=x86_64
          cp build/app/outputs/flutter-apk/app-profile.apk ../test.apk
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: .
          script: bash app/tool/crash_run.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: crash-log, path: out/ }

  real-apk:
    # the exact APKs people download (arm64 / 32-bit), run through ARM translation on the emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Download published APKs + test account
        id: acct
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gh release download latest -p 'adda.apk' -p 'adda-old-phones.apk' -R ${{ github.repository }}
          ls -la *.apk
          as=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          echo "== signature of adda.apk"; $as verify --print-certs adda.apk | grep -E "DN|SHA-256" | head -3
          email="ci$(date +%s)r@adda-test.dev"; pass="Ci-$(openssl rand -hex 8)"
          curl -s -X POST "$URL/auth/v1/signup" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$pass\"}" -o /dev/null -w "signup %{http_code}\n"
          echo "::add-mask::$pass"
          echo "email=$email" >> "$GITHUB_OUTPUT"; echo "pass=$pass" >> "$GITHUB_OUTPUT"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run published APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash app/tool/real_run.sh adda.apk ${{ steps.acct.outputs.email }} ${{ steps.acct.outputs.pass }}
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: real-apk-log, path: out/ }

  tour:
    # screenshots of every main screen on a small phone, normal and large text
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup.sh
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - name: Test account
        id: acct
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          email="tour$(date +%s)@adda-test.dev"; pass="Ci-$(openssl rand -hex 8)"
          curl -s -X POST "$URL/auth/v1/signup" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$pass\"}" -o /dev/null -w "signup %{http_code}\n"
          echo "::add-mask::$pass"
          echo "email=$email" >> "$GITHUB_OUTPUT"; echo "pass=$pass" >> "$GITHUB_OUTPUT"
      - name: Build tour APK
        working-directory: app
        run: |
          flutter build apk --profile --target-platform android-x64 \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=AUTO_LOGIN_EMAIL=${{ steps.acct.outputs.email }} --dart-define=AUTO_LOGIN_PASSWORD=${{ steps.acct.outputs.pass }} \
            --dart-define=TOUR=true --android-project-arg=addaAbi=x86_64
          cp build/app/outputs/flutter-apk/app-profile.apk ../tour.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the tour
        timeout-minutes: 25
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          script: bash app/tool/tour_run.sh tour.apk
      - name: Save screenshots to the ci-screens branch
        if: always()
        run: |
          cd shots 2>/dev/null || exit 0
          git init -q && git checkout -q -b ci-screens
          git config user.name "adda-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens
