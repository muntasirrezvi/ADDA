# One-time: registers the app with Shorebird (needs the SHOREBIRD_TOKEN secret) and commits shorebird.yaml.
name: shorebird-init
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/shorebird-init.yml]
permissions: { contents: write }
jobs:
  init:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - name: Check the token is set
        env: { SHOREBIRD_TOKEN: "${{ secrets.SHOREBIRD_TOKEN }}" }
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then echo "::error::SHOREBIRD_TOKEN secret is missing"; exit 1; fi
          if [ -f shorebird.yaml ]; then echo "already set up"; cat shorebird.yaml; fi
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: shorebirdtech/setup-shorebird@v1
        with: { cache: true }
      - run: bash tool/setup.sh
      - name: shorebird init
        if: hashFiles('app/shorebird.yaml') == ''
        env: { SHOREBIRD_TOKEN: "${{ secrets.SHOREBIRD_TOKEN }}" }
        run: shorebird init --force --display-name Adda
      - name: Save shorebird.yaml
        run: |
          cat shorebird.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          git diff --cached --quiet || (git commit -m "Connect Shorebird code push" && git push)
