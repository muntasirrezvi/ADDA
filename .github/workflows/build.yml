name: build

on:
  push:
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run the smoke test
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "create database adda"
          psql -v ON_ERROR_STOP=1 -q -d adda -f supabase/tests/local_stubs.sql
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -d adda -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -d adda -f supabase/tests/smoke.sql > smoke.log 2>&1 || (cat smoke.log; exit 1)
          echo "smoke test passed"

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  # Publishes the admin console to GitHub Pages: https://<owner>.github.io/<repo>/
  console-site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Build the console
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build && touch out/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: admin/out
          publish_branch: gh-pages
          force_orphan: true

  # Android. Code-only changes go out as Shorebird patches (the installed app updates itself on the
  # next restart). Changes to packages, pictures, sounds or native settings, or a commit message with
  # [release], make a full new APK instead.
  android:
    runs-on: ubuntu-latest
    permissions: { contents: write }   # to publish the download link and move the release marker
    defaults: { run: { working-directory: app } }
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      DEFINES: --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: shorebirdtech/setup-shorebird@v1
        with: { cache: true }
      - run: bash tool/setup.sh
      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Patch or full release?
        id: mode
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true
          last=$(git rev-parse -q --verify refs/tags/sb-release || true)
          mode=patch
          if [ -z "$last" ]; then mode=release; reason="first release"
          elif git log -1 --format=%B | grep -qi '\[release\]'; then mode=release; reason="[release] in commit message"
          elif [ -n "$(git diff --name-only "$last" HEAD -- pubspec.yaml assets tool)" ]; then mode=release; reason="packages, assets or native settings changed"
          else reason="code-only change since the last release"; fi
          before="${{ github.event.before }}"
          if [ "$mode" = patch ] && git cat-file -e "$before" 2>/dev/null && [ -z "$(git diff --name-only "$before" HEAD -- .)" ]; then
            mode=none; reason="nothing in the app changed"
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then mode=build; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "### Android: $mode ($reason)" >> "$GITHUB_STEP_SUMMARY"
      - name: Signing key (same every build, so updates install over the old app)
        if: steps.mode.outputs.mode != 'none'
        env:
          ADDA_SIGN_SEED: ${{ secrets.ADDA_SIGN_SEED }}
        run: |
          if [ -z "$ADDA_SIGN_SEED" ]; then
            echo "::warning::Add the ADDA_SIGN_SEED secret so every APK installs over the previous one."
            echo "### ⚠ Temporary signing key: add the ADDA_SIGN_SEED secret" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          pip install -q cryptography >/dev/null 2>&1 || true
          pass=$(printf '%s' "adda-pass:$ADDA_SIGN_SEED" | sha256sum | cut -c1-32); echo "::add-mask::$pass"
          ADDA_KEY_PASS="$pass" python3 tool/make_keystore.py "$RUNNER_TEMP/adda.p12"
          echo "ADDA_KEYSTORE=$RUNNER_TEMP/adda.p12" >> "$GITHUB_ENV"
          echo "ADDA_KEY_PASS=$pass" >> "$GITHUB_ENV"
          echo "### Signed with the permanent Adda key" >> "$GITHUB_STEP_SUMMARY"
      - name: Shorebird patch
        id: patch
        if: steps.mode.outputs.mode == 'patch'
        continue-on-error: true
        run: shorebird patch android --release-version=latest $DEFINES --android-project-arg=addaAbi=arm64-v8a+armeabi-v7a
      - name: Shorebird release (full APK)
        id: release
        if: steps.mode.outputs.mode == 'release' || steps.patch.outcome == 'failure'
        run: |
          # one APK for every phone: 64-bit and 32-bit
          shorebird release android --artifact=apk --target-platform=android-arm,android-arm64 --build-number=${{ github.run_number }} $DEFINES --android-project-arg=addaAbi=arm64-v8a+armeabi-v7a
          mkdir -p ../dist && cp build/app/outputs/flutter-apk/app-release.apk ../dist/adda.apk
          cp ../dist/adda.apk ../dist/adda-old-phones.apk   # the old link keeps working
          ls -la ../dist
          echo "Phone types inside the APK:"; unzip -l ../dist/adda.apk | grep -oE 'lib/[^/]+/' | sort | uniq -c
          unzip -l ../dist/adda.apk | grep -q 'lib/armeabi-v7a/libflutter.so' || { echo "::error::APK has no 32-bit Flutter library"; exit 1; }
      - name: Plain build (branches)
        if: steps.mode.outputs.mode == 'build'
        run: flutter build apk --release --split-per-abi $DEFINES
      - uses: actions/upload-artifact@v5
        if: steps.release.outcome == 'success'
        with: { name: adda-apk, path: dist/*.apk }
      # Same link every time:  https://github.com/<owner>/<repo>/releases/download/latest/adda.apk
      - name: Publish the download link
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd ../dist
          notes="Build $(date -u '+%Y-%m-%d %H:%M') UTC from commit ${GITHUB_SHA::7}. adda.apk works on every Android 7+ phone (64-bit and 32-bit) and updates itself after this."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest adda.apk adda-old-phones.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest adda.apk adda-old-phones.apk --prerelease --title "Adda test build" --notes "$notes"
          fi
          git tag -f sb-release "$GITHUB_SHA" && git push -f origin refs/tags/sb-release

  # iPhone build. Not signed: install it with Sideloadly or AltStore using your Apple ID,
  # or add signing + TestFlight later with a paid Apple Developer account.
  ios:
    runs-on: macos-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup.sh
      - run: flutter pub get
      - name: Build iOS app (unsigned)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry adda-ios.ipa Payload && ls -lh adda-ios.ipa
      - uses: actions/upload-artifact@v5
        with: { name: adda-ios, path: app/build/ipa/adda-ios.ipa }
      - name: Publish the iPhone download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd build/ipa
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest adda-ios.ipa --clobber
          else
            gh release create latest adda-ios.ipa --prerelease --title "Adda test build" --notes "Test build"
          fi

  # Sets up your live Supabase project: database changes, then the server functions.
  # Runs only on the main branch, only after the database test passes, and only once the
  # SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD secrets exist.
  deploy:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the deploy secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Deploy skipped: add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD in Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with: { version: latest }
      - name: Link the project
        if: steps.check.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database changes
        if: steps.check.outputs.skip != 'true'
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Copy server secrets from GitHub to Supabase
        if: steps.check.outputs.skip != 'true'
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          SSLCOMMERZ_LIVE: ${{ secrets.SSLCOMMERZ_LIVE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          args=("APP_RETURN_URL=adda://wallet" "ANDROID_PACKAGE_NAME=app.adda.voice")
          for name in AGORA_APP_ID AGORA_APP_CERTIFICATE SSLCOMMERZ_STORE_ID SSLCOMMERZ_STORE_PASSWORD SSLCOMMERZ_LIVE \
                      GOOGLE_SERVICE_ACCOUNT_JSON FIREBASE_SERVICE_ACCOUNT_JSON PUSH_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); echo "will set $name"; fi
          done
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" > /dev/null
      - name: Deploy server functions
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
