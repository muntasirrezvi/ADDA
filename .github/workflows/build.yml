name: build

on:
  push:
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run the smoke test
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "create database adda"
          psql -v ON_ERROR_STOP=1 -q -d adda -f supabase/tests/local_stubs.sql
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -d adda -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -d adda -f supabase/tests/smoke.sql > smoke.log 2>&1 || (cat smoke.log; exit 1)
          echo "smoke test passed"

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    permissions: { contents: write }   # to publish the download link
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup.sh
      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v5
        with:
          name: adda-apk
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
      # Same link every time, always the newest build from main:
      #   https://github.com/<owner>/<repo>/releases/download/latest/adda.apk
      - name: Publish the test download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk adda.apk
          cp app-armeabi-v7a-release.apk adda-old-phones.apk
          notes="Test build $(date -u '+%Y-%m-%d %H:%M') UTC from commit ${GITHUB_SHA::7}. Install adda.apk; use adda-old-phones.apk only if it does not install."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest adda.apk adda-old-phones.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest adda.apk adda-old-phones.apk --prerelease --title "Adda test build" --notes "$notes"
          fi

  # Sets up your live Supabase project: database changes, then the server functions.
  # Runs only on the main branch, only after the database test passes, and only once the
  # SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD secrets exist.
  deploy:
    needs: database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the deploy secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Deploy skipped: add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD in Settings > Secrets and variables > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with: { version: latest }
      - name: Link the project
        if: steps.check.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database changes
        if: steps.check.outputs.skip != 'true'
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Copy server secrets from GitHub to Supabase
        if: steps.check.outputs.skip != 'true'
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          SSLCOMMERZ_LIVE: ${{ secrets.SSLCOMMERZ_LIVE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          args=("APP_RETURN_URL=adda://wallet" "ANDROID_PACKAGE_NAME=app.adda.voice")
          for name in AGORA_APP_ID AGORA_APP_CERTIFICATE SSLCOMMERZ_STORE_ID SSLCOMMERZ_STORE_PASSWORD SSLCOMMERZ_LIVE \
                      GOOGLE_SERVICE_ACCOUNT_JSON FIREBASE_SERVICE_ACCOUNT_JSON PUSH_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); echo "will set $name"; fi
          done
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" > /dev/null
      - name: Deploy server functions
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
