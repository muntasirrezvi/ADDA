# Supabase CLI settings for Adda
project_id = "adda"

[functions.agora-token]
verify_jwt = true

[functions.pay-create]
verify_jwt = true

[functions.pay-google-verify]
verify_jwt = true

# SSLCommerz posts here without a Supabase token; every payment is checked with SSLCommerz's validation API
[functions.pay-sslcommerz-ipn]
verify_jwt = false

# called by a Database Webhook; protected by the x-webhook-secret header
[functions.push]
verify_jwt = false

# phone + password sign-in (looks up the account's email); Supabase's own rate limits apply to the password check
[functions.login-phone]
verify_jwt = false

[functions.make-avatar]
verify_jwt = true
