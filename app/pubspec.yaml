name: adda
description: Adda — voice party rooms, gifts, reels and calls.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  agora_rtc_engine: ^6.5.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0
  video_player: ^2.9.2
  just_audio: ^0.9.42
  webview_flutter: ^4.10.0
  in_app_purchase: ^3.2.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  lottie: ^3.1.3
  url_launcher: ^6.3.1
  flutter_foreground_task: 9.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/games/
    - assets/gifts/
    - assets/sfx/
    - shorebird.yaml
